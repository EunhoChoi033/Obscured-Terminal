name: Build Obscured App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        # This runs the process twice: once on Windows and once on Mac
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If you have other requirements (like numpy), add them here:
        # pip install -r requirements.txt

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: pyinstaller --onefile --windowed --name "Obscured" enigma_app.py

    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: pyinstaller --onefile --windowed --name "Obscured" --osx-bundle-identifier com.enigma.obscured enigma_app.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Obscured-${{ matrix.os }}
        path: |
          dist/Obscured.exe
          dist/Obscured.app